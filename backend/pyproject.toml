[project]
name = "fipilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.1",
    "pymupdf>=1.27.2.3",
    "ultralytics>=8.4.67",
    "onnxruntime>=1.17",
    "opencv-python>=4.13,!=4.13.0.92",
    "json-repair>=0.61.5",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "azure-cognitiveservices-speech>=1.51.1",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "psycopg[binary]>=3.3.4",
    "bcrypt>=5.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fipilot*"]

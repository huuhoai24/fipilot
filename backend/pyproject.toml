[project]
name = "cv-driven-ai-interviewer"
version = "0.1.0"
description = "V2 CV-driven text interview backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "firebase-admin",
    "google-cloud-firestore",
    "google-genai",
    "pydantic",
    "pydantic-settings",
    "pypdf",
    "python-docx",
    "python-dotenv",
    "python-multipart",
    "sqlalchemy",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

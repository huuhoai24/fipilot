[project]
name = "fipilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=1.0.0",
    "ipykernel>=7.2.0",
    "jinja2>=3.1.6",
    "jupyter>=1.1.1",
    "python-dotenv>=1.0.1",
    "pymupdf>=1.27.2.3",
    "torch>=2.12.0",
    "transformers>=4.45.0",
    "ultralytics>=8.4.67",
    "ollama>=0.6.2",
    "json-repair>=0.61.5",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fipilot*"]

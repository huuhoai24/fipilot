<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">AI Interview Platform - System Context</title>
  <desc id="desc">Sơ đồ ngữ cảnh giữa ứng viên, web client, API platform, Firebase, Firestore, Vertex AI và speech inference.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7dd3fc"/>
    </marker>
    <style>
      .title{font:700 38px Inter,Segoe UI,sans-serif;fill:#f8fafc}
      .subtitle{font:400 17px Inter,Segoe UI,sans-serif;fill:#94a3b8}
      .boxTitle{font:700 21px Inter,Segoe UI,sans-serif;fill:#f8fafc}
      .boxText{font:400 15px Inter,Segoe UI,sans-serif;fill:#cbd5e1}
      .label{font:600 13px Inter,Segoe UI,sans-serif;fill:#bae6fd}
      .line{stroke:#7dd3fc;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1440" height="860" rx="28" fill="url(#bg)"/>
  <circle cx="1220" cy="80" r="210" fill="#2563eb" opacity=".08"/>
  <circle cx="220" cy="810" r="250" fill="#8b5cf6" opacity=".07"/>
  <text x="72" y="72" class="title">AI Interview Platform — System Context</text>
  <text x="72" y="105" class="subtitle">CV-driven, adaptive technical interviews in text and realtime voice</text>

  <g filter="url(#shadow)">
    <rect x="80" y="310" width="230" height="180" rx="24" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="195" cy="365" r="30" fill="#2563eb"/>
    <circle cx="195" cy="355" r="10" fill="#dbeafe"/>
    <path d="M174 382c7-18 35-18 42 0" fill="#dbeafe"/>
    <text x="195" y="428" text-anchor="middle" class="boxTitle">Ứng viên</text>
    <text x="195" y="457" text-anchor="middle" class="boxText">Đăng nhập · tải CV</text>
    <text x="195" y="480" text-anchor="middle" class="boxText">Text / voice interview</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="255" width="430" height="290" rx="30" fill="url(#core)" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="487" y="300" width="356" height="78" rx="16" fill="#0f172a" opacity=".56"/>
    <text x="665" y="333" text-anchor="middle" class="boxTitle">Web Client</text>
    <text x="665" y="360" text-anchor="middle" class="boxText">React · Firebase SDK · Web Audio</text>
    <rect x="487" y="399" width="356" height="105" rx="16" fill="#0f172a" opacity=".56"/>
    <text x="665" y="435" text-anchor="middle" class="boxTitle">AI Interview API</text>
    <text x="665" y="464" text-anchor="middle" class="boxText">FastAPI · Orchestrator · Domain Services</text>
    <text x="665" y="488" text-anchor="middle" class="boxText">REST + WebSocket</text>
    <text x="665" y="230" text-anchor="middle" class="boxTitle">System Boundary</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="145" width="300" height="115" rx="20" fill="#153448" stroke="#38bdf8" stroke-width="2"/>
    <text x="1190" y="190" text-anchor="middle" class="boxTitle">Firebase Auth</text>
    <text x="1190" y="219" text-anchor="middle" class="boxText">Google Sign-In · ID tokens</text>
    <text x="1190" y="242" text-anchor="middle" class="boxText">Identity verification</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="300" width="300" height="115" rx="20" fill="#153448" stroke="#34d399" stroke-width="2"/>
    <text x="1190" y="346" text-anchor="middle" class="boxTitle">Cloud Firestore</text>
    <text x="1190" y="375" text-anchor="middle" class="boxText">Profiles · session state</text>
    <text x="1190" y="398" text-anchor="middle" class="boxText">Turns · reports</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="455" width="300" height="115" rx="20" fill="#153448" stroke="#fbbf24" stroke-width="2"/>
    <text x="1190" y="501" text-anchor="middle" class="boxTitle">Vertex AI Gemini</text>
    <text x="1190" y="530" text-anchor="middle" class="boxText">CV · plan · question</text>
    <text x="1190" y="553" text-anchor="middle" class="boxText">Evaluation · report</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="610" width="300" height="135" rx="20" fill="#153448" stroke="#f472b6" stroke-width="2"/>
    <text x="1190" y="653" text-anchor="middle" class="boxTitle">Speech Inference</text>
    <text x="1190" y="682" text-anchor="middle" class="boxText">Silero VAD · faster-whisper</text>
    <text x="1190" y="705" text-anchor="middle" class="boxText">VieNeu-TTS · GPU</text>
    <text x="1190" y="728" text-anchor="middle" class="boxText">(target production)</text>
  </g>

  <path class="line" d="M310 400 H444"/>
  <text x="377" y="382" text-anchor="middle" class="label">HTTPS / WSS</text>

  <path class="line" d="M880 320 C945 320 965 205 1034 205"/>
  <text x="951" y="246" text-anchor="middle" class="label">Auth</text>
  <path class="line" d="M880 380 C950 380 965 358 1034 358"/>
  <text x="951" y="347" text-anchor="middle" class="label">Read / write</text>
  <path class="line" d="M880 440 C950 440 966 510 1034 510"/>
  <text x="956" y="476" text-anchor="middle" class="label">Structured AI</text>
  <path class="line dash" d="M790 545 C850 685 930 678 1034 678"/>
  <text x="910" y="662" text-anchor="middle" class="label">Internal WSS · PCM</text>

  <rect x="80" y="735" width="795" height="62" rx="15" fill="#0f172a" opacity=".75" stroke="#334155"/>
  <circle cx="112" cy="766" r="7" fill="#22c55e"/>
  <text x="132" y="772" class="boxText">Trust boundary: browser requests use Firebase identity; speech traffic uses a separate internal service credential.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Text Interview Sequence</title>
  <desc id="desc">Luồng upload CV, bắt đầu phỏng vấn, chấm câu trả lời và sinh báo cáo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#14243b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#7dd3fc"/></marker>
    <marker id="return" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M10 0L0 5 10 10Z" fill="#94a3b8"/></marker>
    <style>
      .t{font:700 36px Inter,Segoe UI,sans-serif;fill:#f8fafc}.s{font:400 16px Inter,Segoe UI,sans-serif;fill:#94a3b8}
      .h{font:700 17px Inter,Segoe UI,sans-serif;fill:#f8fafc}.b{font:500 13px Inter,Segoe UI,sans-serif;fill:#dbeafe}
      .life{stroke:#475569;stroke-width:2;stroke-dasharray:7 7}.call{stroke:#7dd3fc;stroke-width:2;marker-end:url(#arrow)}
      .ret{stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:6 5;marker-start:url(#return)}
      .note{fill:#172554;stroke:#818cf8;stroke-width:1.3}.phase{fill:#0f2942;stroke:#38bdf8;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1600" height="1080" rx="28" fill="url(#bg)"/>
  <text x="60" y="62" class="t">Text Interview — End-to-End Sequence</text>
  <text x="60" y="94" class="s">Firebase-authenticated flow with durable state after every turn</text>

  <g>
    <rect x="55" y="130" width="190" height="66" rx="14" fill="#1d4ed8"/><text x="150" y="171" text-anchor="middle" class="h">Web Client</text>
    <rect x="335" y="130" width="190" height="66" rx="14" fill="#4338ca"/><text x="430" y="171" text-anchor="middle" class="h">Gateway API</text>
    <rect x="615" y="130" width="190" height="66" rx="14" fill="#6d28d9"/><text x="710" y="171" text-anchor="middle" class="h">Orchestrator</text>
    <rect x="895" y="130" width="190" height="66" rx="14" fill="#b45309"/><text x="990" y="171" text-anchor="middle" class="h">Gemini Agents</text>
    <rect x="1175" y="130" width="190" height="66" rx="14" fill="#047857"/><text x="1270" y="171" text-anchor="middle" class="h">Repository</text>
    <rect x="1410" y="130" width="140" height="66" rx="14" fill="#0369a1"/><text x="1480" y="159" text-anchor="middle" class="h">Firebase</text><text x="1480" y="181" text-anchor="middle" class="b">Auth</text>
    <path d="M150 196V1020M430 196V1020M710 196V1020M990 196V1020M1270 196V1020M1480 196V1020" class="life"/>
  </g>

  <rect x="48" y="222" width="1504" height="42" rx="10" class="phase"/><text x="70" y="249" class="h">A. Upload &amp; hiểu CV</text>
  <line x1="150" y1="294" x2="420" y2="294" class="call"/><text x="285" y="283" text-anchor="middle" class="b">POST /resume/upload + ID token</text>
  <line x1="430" y1="326" x2="1470" y2="326" class="call"/><text x="950" y="315" text-anchor="middle" class="b">verifyIdToken(token)</text>
  <line x1="430" y1="365" x2="980" y2="365" class="call"/><text x="705" y="354" text-anchor="middle" class="b">extract CandidateProfile(resume text)</text>
  <line x1="990" y1="397" x2="440" y2="397" class="ret"/><text x="715" y="386" text-anchor="middle" class="b">validated structured JSON</text>
  <line x1="430" y1="435" x2="1260" y2="435" class="call"/><text x="845" y="424" text-anchor="middle" class="b">save profile + raw text under uid</text>
  <line x1="430" y1="469" x2="160" y2="469" class="ret"/><text x="295" y="458" text-anchor="middle" class="b">candidate_id + profile</text>
  <rect x="545" y="285" width="300" height="50" rx="10" class="note"/><text x="695" y="307" text-anchor="middle" class="b">PDF/DOCX được parse trong temp file</text><text x="695" y="326" text-anchor="middle" class="b">và luôn xóa trong finally</text>

  <rect x="48" y="500" width="1504" height="42" rx="10" class="phase"/><text x="70" y="527" class="h">B. Bắt đầu session</text>
  <line x1="150" y1="570" x2="420" y2="570" class="call"/><text x="285" y="559" text-anchor="middle" class="b">POST /interview/start</text>
  <line x1="430" y1="605" x2="700" y2="605" class="call"/><text x="565" y="594" text-anchor="middle" class="b">start_interview(profile, config)</text>
  <line x1="710" y1="640" x2="980" y2="640" class="call"/><text x="845" y="629" text-anchor="middle" class="b">plan + first question</text>
  <line x1="710" y1="675" x2="1260" y2="675" class="call"/><text x="985" y="664" text-anchor="middle" class="b">create session + save state/turn</text>
  <line x1="430" y1="710" x2="160" y2="710" class="ret"/><text x="295" y="699" text-anchor="middle" class="b">session_id + current question</text>

  <rect x="48" y="742" width="1504" height="42" rx="10" class="phase"/><text x="70" y="769" class="h">C. Adaptive answer loop</text>
  <line x1="150" y1="812" x2="420" y2="812" class="call"/><text x="285" y="801" text-anchor="middle" class="b">POST /{session}/answer</text>
  <line x1="430" y1="844" x2="1260" y2="844" class="call"/><text x="845" y="833" text-anchor="middle" class="b">load state scoped by uid</text>
  <line x1="430" y1="876" x2="700" y2="876" class="call"/><text x="565" y="865" text-anchor="middle" class="b">submit_answer(state, answer)</text>
  <line x1="710" y1="908" x2="980" y2="908" class="call"/><text x="845" y="897" text-anchor="middle" class="b">evaluate + generate next</text>
  <rect x="805" y="926" width="370" height="60" rx="12" class="note"/><text x="990" y="950" text-anchor="middle" class="b">Decision: follow-up · increase difficulty</text><text x="990" y="972" text-anchor="middle" class="b">next question · finish</text>
  <line x1="710" y1="1005" x2="1260" y2="1005" class="call"/><text x="985" y="994" text-anchor="middle" class="b">persist updated snapshot + turn</text>
  <line x1="430" y1="1033" x2="160" y2="1033" class="ret"/><text x="295" y="1022" text-anchor="middle" class="b">updated state / completed</text>
</svg>

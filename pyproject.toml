[project]
name = "fipilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "docling>=2.94.0",
    "huggingface-hub>=0.36.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "openai>=2.36.0",
    "torch>=2.12.0",
    "transformers>=4.45.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config"]
